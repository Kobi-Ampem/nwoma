name: Deploy API

# Builds the container image and deploys the nwoma-api stack. Needs the bootstrap stack and the
# repository variables AWS_DEPLOY_ROLE_ARN, ARTIFACTS_BUCKET and ECR_REPOSITORY_URI.
on:
  push:
    branches: [main]
    paths: [api/**, extract/**, normalise/**, ocr/**, datagen/models.py, infra/template.yaml, Dockerfile, pyproject.toml, uv.lock]
  workflow_dispatch:

concurrency: deploy-api

env:
  AWS_REGION: eu-west-3

jobs:
  test:  # a commit that fails the tests never reaches AWS
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: test
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # short-lived AWS credentials through OIDC; no stored keys
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build inputs from the private bucket
        run: |
          mkdir -p artifacts
          aws s3 cp "s3://${{ vars.ARTIFACTS_BUCKET }}/nwoma-artifacts.tar.gz" - | tar -xz -C artifacts
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2
      - name: Log in to ECR Public (anonymous pulls are rate-limited on shared runners)
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws
      - name: Build and push the image
        id: image
        run: |
          uri="${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}"
          docker build -t "$uri" .
          docker push "$uri"
          echo "uri=$uri" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52  # v3
        with:
          use-installer: true
      - name: Deploy
        run: |
          sam deploy --template-file infra/template.yaml --stack-name nwoma-api \
            --region "$AWS_REGION" \
            --image-repository ${{ vars.ECR_REPOSITORY_URI }} \
            --parameter-overrides ImageUri=${{ steps.image.outputs.uri }} ReservedConcurrency=${{ vars.RESERVED_CONCURRENCY || '1' }} \
            --tags project=nwoma --no-confirm-changeset --no-fail-on-empty-changeset
      - name: Smoke test the live API with a sample document
        # CI tests run without the trained models; this is the first time they run end to end.
        # A new image cold-starts in minutes, so the first tries may time out.
        run: |
          url=$(aws cloudformation describe-stacks --stack-name nwoma-api \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          for try in 1 2 3 4 5 6 7 8; do
            if curl -sf -m 150 -F file=@api/samples/lab-report-en-digital.pdf "${url%/}/extract" -o reply.json \
              && jq -e '.doc_type == "lab" and (.extraction.results | length) > 0' reply.json; then
              echo "The API extracted $(jq '.extraction.results | length' reply.json) results"
              exit 0
            fi
            echo "Try $try failed; the function may still be starting"
            sleep 30
          done
          exit 1
