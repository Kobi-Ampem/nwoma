name: Review UI

# Publishes web/ to GitHub Pages. VITE_API_URL comes from the repository variable NWOMA_API_URL.
on:
  push:
    branches: [main]
    paths: [web/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency: pages

jobs:
  test:  # a commit that fails the tests is never published
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    if: vars.NWOMA_API_URL != ''  # waits until the API is deployed and its URL recorded
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.NWOMA_API_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
