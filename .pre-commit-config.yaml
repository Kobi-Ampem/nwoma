repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # syntax only: CloudFormation tags (!Ref, !Sub) are not plain YAML
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1  # keep equal to the ruff version in uv.lock, so the hook and CI agree
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
