AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Nwoma, one-time setup (create once, as an admin, in the CloudFormation console): the GitHub
  deploy role, the image registry, the private build-inputs bucket, the Gemini key parameter and
  the cost guard (a $1.99 monthly budget whose alarm switches the API off).

Parameters:
  GitHubSubjectPrefix:
    Type: String
    Default: repo:Kobi-Ampem@210767259/nwoma@1427403489
    Description: >-
      The repository's OIDC subject prefix, with GitHub's immutable owner and repository IDs
      (gh api repos/OWNER/REPO/actions/oidc/customization/sub). A renamed or re-created
      look-alike repository cannot match it.
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: '"false" if this account already has the token.actions.githubusercontent.com provider'
  AlertEmail:
    Type: String
    Description: Where budget alerts are sent
  MonthlyLimitUsd:
    Type: String
    Default: "1.99"

Conditions:
  CreateOidc: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  # --- Deploying from GitHub Actions, without stored AWS keys --------------------------------
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: nwoma-github-deploy
      Description: Assumed by GitHub Actions on the main branch of the Nwoma repository only
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub ${GitHubSubjectPrefix}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy-nwoma-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PushImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt Repository.Arn
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              # Logged-in pulls of the public Lambda Web Adapter image: anonymous pulls from
              # GitHub's shared runners are rate-limited (429 Too Many Requests).
              - Sid: PublicRegistryLogin
                Effect: Allow
                Action: [ecr-public:GetAuthorizationToken, sts:GetServiceBearerToken]
                Resource: "*"
              - Sid: ReadBuildInputs
                Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub ${ArtifactsBucket.Arn}/*
              - Sid: DeployAppStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/nwoma-api/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: ManageApiFunction
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:CreateFunctionUrlConfig
                  - lambda:DeleteFunction
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionUrlConfig
                  - lambda:GetPolicy
                  - lambda:ListTags
                  - lambda:PutFunctionConcurrency
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:UpdateFunctionUrlConfig
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:nwoma-api
              - Sid: ManageApiRole
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/nwoma-api-*
              - Sid: ManageApiLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                Resource: "*"
              - Sid: ManageKeepWarmSchedule
                Effect: Allow
                Action:
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:PutRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:TagResource
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/nwoma-api-*
              - Sid: ReadGeminiKeyAtDeploy
                Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nwoma/*
      Tags:
        - {Key: project, Value: nwoma}

  # --- Where the image and its build inputs live ---------------------------------------------
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: nwoma
      ImageTagMutability: MUTABLE
      # Lambda pulls the image itself; only for the nwoma-api function of this account.
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaPullForNwomaApi
            Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
            Condition:
              StringLike:
                aws:sourceArn: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:nwoma-api
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules": [{"rulePriority": 1, "description": "Keep the last 2 images",
          "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 2},
          "action": {"type": "expire"}}]}
      Tags:
        - {Key: project, Value: nwoma}

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub nwoma-build-inputs-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      Tags:
        - {Key: project, Value: nwoma}

  # Set the real key in the console (Systems Manager > Parameter Store) after creating the stack.
  # 'none' keeps the LLM fallback off. The key is for a free-tier project with billing off.
  GeminiKey:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /nwoma/gemini-api-key
      Type: String
      Value: none
      Tags: {project: nwoma}

  # --- Cost guard: AWS has no hard spending cap, so the alarm switches the API off ------------
  KillSwitchTopic:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - {Key: project, Value: nwoma}

  KillSwitchTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref KillSwitchTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: budgets.amazonaws.com}
            Action: SNS:Publish
            Resource: !Ref KillSwitchTopic

  KillSwitchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: stop-nwoma-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:PutFunctionConcurrency
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:nwoma-api
      Tags:
        - {Key: project, Value: nwoma}

  KillSwitch:
    Type: AWS::Lambda::Function
    Properties:
      Description: Sets the API's concurrency to 0 when the budget alarm fires
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt KillSwitchRole.Arn
      Timeout: 10
      Code:
        ZipFile: |
          import boto3

          def handler(event, context):
              boto3.client("lambda").put_function_concurrency(
                  FunctionName="nwoma-api", ReservedConcurrentExecutions=0
              )
              print("nwoma-api stopped by the budget alarm")
      Tags:
        - {Key: project, Value: nwoma}

  KillSwitchSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref KillSwitchTopic
      Protocol: lambda
      Endpoint: !GetAtt KillSwitch.Arn

  KillSwitchPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref KillSwitch
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref KillSwitchTopic

  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: nwoma-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyLimitUsd, Unit: USD}
        # Counts only resources tagged project=nwoma: activate the tag once in
        # Billing > Cost allocation tags, or other projects in the account would count too.
        CostFilters:
          TagKeyValue: ["user:project$nwoma"]
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 90}
          Subscribers:
            - {SubscriptionType: EMAIL, Address: !Ref AlertEmail}
            - {SubscriptionType: SNS, Address: !Ref KillSwitchTopic}

Outputs:
  DeployRoleArn:
    Description: GitHub repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  ArtifactsBucketName:
    Description: GitHub repository variable ARTIFACTS_BUCKET
    Value: !Ref ArtifactsBucket
  RepositoryUri:
    Description: GitHub repository variable ECR_REPOSITORY_URI
    Value: !GetAtt Repository.RepositoryUri
