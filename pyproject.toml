[project]
name = "nwoma"
version = "0.0.1"
description = "Bilingual clinical document extraction: fine-tuned transformer + LLM cascade, evals, FHIR export"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kobi Ampem Afriyie" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.156.8",
    "google-genai>=2.31.0",
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pydantic>=2.8",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "tokenizers>=0.23.3",
    "transformers>=5.20.2",  # the NER tokenizer at runtime (no PyTorch needed)
    "uvicorn>=0.54.0",
]

[dependency-groups]
# Only what the API runs is in the main dependencies, so the deployed image stays small.
datagen = [
    "faker>=40.43.0",
    "jinja2>=3.1.6",
    "weasyprint>=70.0",
]
mcp = ["mcp>=2.3.0"]
dev = [
    { include-group = "datagen" },
    { include-group = "mcp" },
    "fhir-resources>=8.3.0",
    "httpx>=0.28.1",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
]
train = ["sentencepiece>=0.2.2"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^web/", "^infra/"]

[[tool.mypy.overrides]]
module = ["weasyprint", "torch", "onnxruntime", "onnxruntime.*"]  # no types, or Colab-only
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
